<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Visualização de Áudio</title>
    <link rel="stylesheet" href="css/styles.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>
    <div id="app">
        <header>
            <h1 class="text-primary">Sistema de Visualização de Áudio</h1>
        </header>
        
        <main>
            <section id="controls">
                <div class="control-group">
                    <h3>Controlos de Áudio</h3>
                    <button id="startMic" class="mic-btn">Iniciar Microfone
                        <i class="bi bi-mic"></i>
                    </button>
                    <button id="stopAudio" class="stop-aud-btn" disabled>Parar Áudio
                        <i class="bi bi-square-fill"></i>
                    </button>
                    <input class="audio-type" type="file" id="audioFile" accept="audio/*">
                </div>
                
                <div class="control-group">
                    <h3>Visualização</h3>

                    <select id="visualizationType" hidden>
                        <option value="spectrum">Espectro de Frequências</option>
                        <option value="waveform">Forma de Onda</option>
                        <option value="particles">Partículas</option>
                        <option value="circular">Visualização Circular</option>
                        <option value="spectrum3d">Espectro 3D</option>
                        <option value="oscilloscope">Osciloscópio</option>
                    </select>

                    <div id="currentVisualization" class="current-visualization">
                        Espectro de Frequências
                    </div>

                    <div id="visualization-previews" class="preview-list"></div>
                </div>

                <div class="control-group">
                    <h3>Exportação</h3>
                    <div class="export-buttons">
                        <button id="exportPNG" class="png-btn">Exportar PNG</button>
                        <button id="exportJPEG" class="jpeg-btn">Exportar JPEG</button>
                    </div>
                </div>
            </section>
            
            <section id="visualization-area">
                <div id="canvas-wrapper">
                    <canvas id="audioCanvas"></canvas>
                    <button id="expandBtn" title="Ampliar" aria-label="Ampliar gráfico">
                        <svg class="icon-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
                        </svg>
                        <svg class="icon-collapse" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
                        </svg>
                    </button>
                </div>
                <div id="audioInfo">
                    <p id="audioStatus" class="text-white">Áudio: Parado</p>
                    <p id="audioLevel" class="text-white">Nível: 0%</p>
                </div>
            </section>
            
            <section id="properties-panel">
                <h3 class="text-white">Propriedades da Visualização</h3>
                <div id="properties-container" class="text-white">
                    <!-- Propriedades dinâmicas serão inseridas aqui  -->
                </div>
            </section>
        </main>

        
        <div id="errorModal" class="modal hidden">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Erro</h3>
                <p id="errorMessage"></p>
            </div>
        </div>
        
    </div>
    
    <footer class="site-footer">
        <div class="bottom-bar">
          <h6 class="direitos-reservados">
            <i class="bi bi-c-circle"></i> 
            2026 Copyright: Eduardo e Gabriel.
        </h6>
        </div>
    </footer>
    
    <script src="js/AudioProcessor.js"></script>
    <script src="js/AudioVisualization.js"></script>
    <script src="js/SpectrumVisualization.js"></script>
    <script src="js/WaveformVisualization.js"></script>
    <script src="js/ParticleVisualization.js"></script>
    <script src="js/CircularVisualization.js"></script>
    <script src="js/Spectrum3DVisualization.js"></script>
    <script src="js/OscilloscopeVisualization.js"></script>
    <script src="js/VisualizationEngine.js"></script>
    <script src="js/UIManager.js"></script>
    <script src="js/ExportManager.js"></script>
    <script src="js/App.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
